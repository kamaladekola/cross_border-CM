Network:
  ZoneMap:
    A: [n1, n2]
    B: [n3]
    C: [n4]
    
  TCONNECT:
    - [A, C]
    - [C, B]
    - [B, A]

  nLines: 4
  nScenarios: 4
  lines: "lines"  # lines dataframe
  ptdf: "ptdf"  # PTDF dataframe
  nodal_ptdf: "nodal_ptdf"  # nodal PTDF dataframe
  coupling: "FB"  # or "FB" or "ATC"
  IC_reserve: 500000 # €/MW-year higher than the highest fixed cost
  MC_reserve: 20000 # €/MWh higher than voll


