General: 
  nTimesteps: 24 # number of timesteps 
  # totConsumers: 1000000 # 1 million consumers

ADMM:
 rho_EOM: 1 # rho ADMM penalty term, EOM 
 max_iter: 10000 # maximum number of iterations -> Requires more than 1000 iterations for convergence
 epsilon: 0.1 # stopping criterion - tolerance on "accuracy" with which the coupling constraints are satisfied. Applied to dual and primal residuals.
 CircularBufferSize: 10 # number of iterations for which data will be retained, should be at least 2 and less than max_iter

EOM: 
  parameter_A: 1 # dummy, not used 

Consumers: # Set of representative consumers (instead, define consumers by zones)
  A:
   WTP: 3000.0 # Value of lost load (€/MWh) # change the name to WTP
   D: "A" # Demand timeseries that needs to be picked up
   ela: 0.2 # fraction of demand that is elastic

  B:
   WTP: 3000.0 # Value of lost load (€/MWh)
   D: "B" # Timeseries that needs to be picked up
   ela: 0.2 # fraction of demand that is elastic

Generators: 
  # OPEX are parametrized as a/2 x g^2 + b x g
  A: 
    Baseload:
      a: 0.008 # (€/MWh)^2
      b: 0 # €/MWh
      C: 4000 # MW - existing capacity (set to zero if greenfield)
      I: 180 # k€/MW-year - annualized investment cost (convert to €/MW-year?)
      max_cap: 10000 # MW - maximum capacity

    MidMerit:
      a: 0.032 # (€/MWh)^2
      b: 40 # €/MWh
      C: 4000 # MW - existing capacity (set to zero if greenfield)
      I: 100 # k€/MW-year - annualized investment cost
      max_cap: 10000 # MW - maximum capacity

    Peak:
      a: 0.08 # (€/MWh)^2
      b: 200 # €/MWh
      C: 2000 # MW - existing capacity (set to zero if greenfield)
      I: 70 # k€/MW-year - annualized investment cost
      max_cap: 10000 # MW - maximum capacity

    # WindOnshore:
    #   a: 0 # (€/MWh)^2
    #   b: 0 # €/MWh
    #   C: 5000 # MW
    #   I: 300 # k€/MW-year - annualized investment cost
    #   max_cap: 10000 # MW - maximum capacity
