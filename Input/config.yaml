    #   AF: "SOLAR_SOUTH" # AF solar timeseries that needs to be picked up

  B: 
    Baseload:
      a: 0.008 # (€/MWh)^2
      b: 2 # €/MWh
      C: 10000 # MW - existing capacity (set to zero if greenfield)
      I: 180 # k€/MW-year - annualized investment cost (convert to €/MW-year?)
      max_cap: 10000 # MW - maximum capacity

    MidMerit:
      a: 0.032 # (€/MWh)^2
      b: 40 # €/MWh
      C: 3000 # MW - existing capacity (set to zero if greenfield)
      I: 100 # k€/MW-year - annualized investment cost
      max_cap: 10000 # MW - maximum capacity

    Peak:
      a: 0.08 # (€/MWh)^2
      b: 200 # €/MWh
      C: 1000 # MW - existing capacity (set to zero if greenfield)
      I: 70 # k€/MW-year - annualized investment cost
      max_cap: 10000 # MW - maximum capacity


CapacityMarket:
  local:
    A: 0.0 # €/MW-year (local capacity market price in zone A)
    B: 0.0 # €/MW-year (local capacity market price in zone B)
  foreign:
    A: 0.0 # €/MW-year (foreign capacity market price for zone A)
    B: 0.0 # €/MW-year (foreign capacity market price for zone B)
  demand:
    A: 5000.0 # MW (local capacity demand in zone A)
    B: 5000.0 # MW (local capacity demand in zone B)
  foreign_demand:
    A: 3000.0 # MW (foreign capacity demand for zone A)
    B: 3000.0 # MW (foreign capacity demand for zone B)
  max_capacity_price: 
    A: 100000.0 # €/MW-year (maximum capacity market price)
    B: 100000.0 # €/MW-year (maximum capacity market price)
  capacity_margin:
    A: 0.10 # (10% capacity margin)
    B: 0.10

InterconnectionCapacity:
  A_B:
    f_cap: 3000
    r_cap: 2500



