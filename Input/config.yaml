CM:
  A:
    # explicit/implicit/capacity target for zone A
    capacity_target: 65032.15 # "FB"  - 70327.55 / "ATC" / "noCBP" - 71032.15 / "implicit" - 65032.15
    price_target: 80000    # €/MW (price target for zone A - CONE)
    capacity_margin: 0.05     # 5% capacity margin
    min_price: -10000000
    max_price: 10000000
    D: "A" #
  B:
    capacity_target: 13873.15 # "FB" - 13952.64 / "ATC" / "noCBP" - 14505.14 / "implicit" - 13873.15
    price_target: 75000
    capacity_margin: 0.05
    min_price: -10000000
    max_price: 10000000
    D: "B"
  C:
    capacity_target: 14673.80 # "FB" - 15874.78 / "ATC" / "noCBP" - 17853.55 / "implicit" - 14673.80
    price_target: 70000
    capacity_margin: 0.05
    min_price: -10000000
    max_price: 10000000
    D: "C"

Network:
  ZoneMap:
    A: [n1, n2]
    B: [n3]
    C: [n4]
    
  TCONNECT:
    - [A, C]
    - [C, B]
    - [B, A]

  ATC:
    A:
      C: [1110.6, -1110.6]  # [forward limit, backward limit]
    C:
      B: [257.3, -257.3]
    B: 
      A: [650.0, -1105.9]

